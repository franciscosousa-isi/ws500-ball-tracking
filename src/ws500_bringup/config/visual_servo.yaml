visual_servo_node:
  ros__parameters:
    ball_position_topic: /ws500/ball/position

    target_distance_m: 1.0     # centro da faixa exigida 0.5-1.5m
    min_altitude_m: 1.0
    max_altitude_m: 3.0
    ball_lost_timeout_s: 1.0
    control_rate_hz: 20.0

    # Ganhos proporcionais — PONTO DE PARTIDA, precisam de tuning em voo real.
    kp_distance: 0.6
    kp_yaw: 1.2
    kp_altitude: 0.8

    # Limites de seguranca (m/s, rad/s) — conservadores para os primeiros testes.
    max_vx_mps: 0.6
    max_vz_mps: 0.4
    max_yaw_rate_rps: 0.8
